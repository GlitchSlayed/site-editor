[package]
name = "glitchys-site-editor"
version = "0.1.0"
description = "Local visual editor for Glitchy's Technical Blog"
authors = ["Vansh Datta"]
edition = "2021"

[lib]
name = "glitchys_site_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
tauri-plugin-opener = "2"
