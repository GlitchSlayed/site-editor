[package]
name = "glitchys-site-editor"
version = "0.2.0"
description = "Purpose - Technical Monograph & Content Editor"
authors = ["Vansh Datta"]
edition = "2021"

[lib]
name = "glitchys_site_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
base64 = "0.22"
trash = "5.2"
regex = "1.10"
